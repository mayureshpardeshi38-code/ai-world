
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI WORLD - Resume Maker</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#0b1020;color:white}
header{padding:20px 7%;background:#17213a;font-size:25px;font-weight:bold;color:#9aaaff}
main{max-width:1000px;margin:auto;padding:25px}
h1,h2{text-align:center}
p{color:#cbd1e0}
.card{background:#17213a;padding:22px;border-radius:14px;margin:20px 0}
input,textarea{width:100%;padding:12px;margin:8px 0 15px;border:1px solid #53617e;border-radius:8px;background:#0b1020;color:white}
label{font-weight:bold}
button{padding:13px 20px;border:0;border-radius:8px;background:#6477ff;color:white;font-weight:bold;cursor:pointer;margin:5px}
#resume{background:white;color:#20283a;padding:30px;border-radius:10px;min-height:300px;display:none}
#resume h1{color:#263b78}
#resume h3{color:#263b78;border-bottom:1px solid #aaa;padding-bottom:5px}
#resume p{color:#222;white-space:pre-wrap}
footer{text-align:center;padding:25px;color:#aab1c5}
@media print{
body{background:white}
header,main>h1,main>.intro,.form-card,.actions,footer{display:none!important}
main{padding:0;margin:0}
#resume{display:block!important;border:0;border-radius:0;padding:20px;color:#111}
#resume p{color:#111}
}
</style>
</head>
<body>
<header>🌐 AI WORLD</header>
<main>
<h1>Professional Resume Maker</h1>
<p class="intro" style="text-align:center">Create your professional resume for free.</p>

<div class="card form-card">
<h2>Enter Your Details</h2>
<form id="resumeForm">
<label>Full Name</label>
<input id="name" placeholder="Enter your full name" required>

<label>Email</label>
<input id="email" type="email" placeholder="Enter your email">

<label>Phone Number</label>
<input id="phone" placeholder="Enter your phone number">

<label>Address</label>
<input id="address" placeholder="Enter your city and address">

<label>Career Objective</label>
<textarea id="objective" rows="3" placeholder="Write your career objective"></textarea>

<label>Education</label>
<textarea id="education" rows="3" placeholder="Your school, college, degree and year"></textarea>

<label>Skills</label>
<textarea id="skills" rows="3" placeholder="Your skills"></textarea>

<label>Experience</label>
<textarea id="experience" rows="3" placeholder="Your work experience or fresher"></textarea>

<label>Languages</label>
<input id="languages" placeholder="Hindi, English, Marathi">

<button type="submit">Create My Resume</button>
</form>
</div>

<div id="resume">
<h1 id="rname"></h1>
<p id="rcontact"></p>
<h3>CAREER OBJECTIVE</h3>
<p id="robjective"></p>
<h3>EDUCATION</h3>
<p id="reducation"></p>
<h3>SKILLS</h3>
<p id="rskills"></p>
<h3>EXPERIENCE</h3>
<p id="rexperience"></p>
<h3>LANGUAGES</h3>
<p id="rlanguages"></p>
</div>

<div class="actions" style="text-align:center">
<button id="printBtn" style="display:none" onclick="window.print()">Download / Save Resume as PDF</button>
</div>
</main>
<footer>© 2026 AI WORLD | Free Resume Maker</footer>

<script>
document.getElementById("resumeForm").addEventListener("submit",function(e){
e.preventDefault();
const get=id=>document.getElementById(id).value.trim();
document.getElementById("rname").textContent=get("name");
document.getElementById("rcontact").textContent=
[get("email"),get("phone"),get("address")].filter(Boolean).join(" | ");
document.getElementById("robjective").textContent=get("objective");
document.getElementById("reducation").textContent=get("education");
document.getElementById("rskills").textContent=get("skills");
document.getElementById("rexperience").textContent=get("experience");
document.getElementById("rlanguages").textContent=get("languages");
document.getElementById("resume").style.display="block";
document.getElementById("printBtn").style.display="inline-block";
document.getElementById("resume").scrollIntoView({behavior:"smooth"});
});
</script>
</body>
</html>
